name: VoiceS3R build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Compile M5Stack Atom VoiceS3R
        run: pio run -e m5stack-atom-voices3r

      - name: Publish firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: m5stack-atom-voices3r-firmware
          path: .pio/build/m5stack-atom-voices3r/firmware.bin
          if-no-files-found: error
